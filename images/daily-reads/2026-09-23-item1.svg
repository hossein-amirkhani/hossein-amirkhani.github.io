<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg"><defs>
  <radialGradient id="bgGrad" cx="50%" cy="40%" r="75%">
    <stop offset="0%" stop-color="#f6f9fd"/>
    <stop offset="100%" stop-color="#e2eaf7"/>
  </radialGradient>
  <radialGradient id="glow" cx="50%" cy="45%" r="50%">
    <stop offset="0%" stop-color="#8ec7ff" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#8ec7ff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#ecf1f9"/>
  </linearGradient>
</defs>
<rect width="600" height="600" fill="url(#bgGrad)"/>
<circle cx="300" cy="270" r="230" fill="url(#glow)"/>

<!-- sound waves -->
<g fill="none" stroke="#5ec9e8" stroke-width="6" stroke-linecap="round">
<path d="M400,240 Q425,270 400,300"/>
<path d="M425,215 Q470,270 425,325"/>
<path d="M450,190 Q515,270 450,350"/>
</g>

<!-- main robot -->
<g transform="translate(255,320) rotate(0) scale(1.55)">
<rect x="-32" y="70" width="24" height="55" rx="10" fill="url(#bodyGrad)" stroke="#2b3a55" stroke-width="5"/>
<rect x="8" y="70" width="24" height="55" rx="10" fill="url(#bodyGrad)" stroke="#2b3a55" stroke-width="5"/>
<rect x="-55" y="-30" width="110" height="105" rx="24" fill="url(#bodyGrad)" stroke="#2b3a55" stroke-width="5"/>
<circle cx="0" cy="20" r="14" fill="none" stroke="#4a90e2" stroke-width="5"/>
<g transform="rotate(20)"><rect x="-95" y="-15" width="24" height="70" rx="10" fill="url(#bodyGrad)" stroke="#2b3a55" stroke-width="5"/></g>
<g transform="rotate(-35)"><rect x="71" y="-15" width="24" height="70" rx="10" fill="url(#bodyGrad)" stroke="#2b3a55" stroke-width="5"/></g>
<rect x="-42" y="-100" width="84" height="72" rx="22" fill="url(#bodyGrad)" stroke="#2b3a55" stroke-width="5"/>
<!-- headphone band -->
<path d="M-46,-84 Q0,-140 46,-84" fill="none" stroke="#2b3a55" stroke-width="6" stroke-linecap="round"/>
<circle cx="-46" cy="-70" r="16" fill="url(#bodyGrad)" stroke="#2b3a55" stroke-width="5"/>
<circle cx="46" cy="-70" r="16" fill="url(#bodyGrad)" stroke="#2b3a55" stroke-width="5"/>
<circle cx="-46" cy="-70" r="6" fill="#4a90e2"/>
<circle cx="46" cy="-70" r="6" fill="#4a90e2"/>
<circle cx="-16" cy="-64" r="9" fill="#5ec9e8"/>
<circle cx="16" cy="-64" r="9" fill="#5ec9e8"/>
</g>

<!-- price tag badge -->
<g transform="translate(180,470)">
<circle cx="0" cy="0" r="42" fill="url(#bodyGrad)" stroke="#2b3a55" stroke-width="5"/>
<circle cx="-10" cy="-10" r="7" fill="#e2685a"/>
<line x1="-14" y1="14" x2="14" y2="-14" stroke="#e2685a" stroke-width="6" stroke-linecap="round"/>
<circle cx="10" cy="10" r="7" fill="#e2685a"/>
</g>
</svg>