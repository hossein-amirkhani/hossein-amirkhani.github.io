<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg"><defs>
  <radialGradient id="bgGrad" cx="50%" cy="40%" r="75%">
    <stop offset="0%" stop-color="#f6f9fd"/>
    <stop offset="100%" stop-color="#e2eaf7"/>
  </radialGradient>
  <radialGradient id="glow" cx="50%" cy="45%" r="50%">
    <stop offset="0%" stop-color="#8ec7ff" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#8ec7ff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#ecf1f9"/>
  </linearGradient>
</defs>
<rect width="600" height="600" fill="url(#bgGrad)"/>
<circle cx="300" cy="270" r="230" fill="url(#glow)"/>

<!-- rising bar chart -->
<g stroke="#2b3a55" stroke-width="5" stroke-linejoin="round">
<rect x="380" y="330" width="42" height="70" rx="8" fill="url(#bodyGrad)"/>
<rect x="432" y="280" width="42" height="120" rx="8" fill="url(#bodyGrad)"/>
<rect x="484" y="215" width="42" height="185" rx="8" fill="url(#bodyGrad)"/>
</g>
<path d="M382,320 L440,270 L492,205" fill="none" stroke="#4a90e2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M492,205 L522,203 L494,228 Z" fill="#4a90e2"/>

<!-- main robot -->
<g transform="translate(210,330) rotate(0) scale(1.5)">
<rect x="-32" y="70" width="24" height="55" rx="10" fill="url(#bodyGrad)" stroke="#2b3a55" stroke-width="5"/>
<rect x="8" y="70" width="24" height="55" rx="10" fill="url(#bodyGrad)" stroke="#2b3a55" stroke-width="5"/>
<rect x="-55" y="-30" width="110" height="105" rx="24" fill="url(#bodyGrad)" stroke="#2b3a55" stroke-width="5"/>
<circle cx="0" cy="20" r="14" fill="none" stroke="#4a90e2" stroke-width="5"/>
<g transform="rotate(-15)"><rect x="-95" y="-15" width="24" height="70" rx="10" fill="url(#bodyGrad)" stroke="#2b3a55" stroke-width="5"/></g>
<g transform="rotate(-70)"><rect x="71" y="-45" width="24" height="70" rx="10" fill="url(#bodyGrad)" stroke="#2b3a55" stroke-width="5"/></g>
<rect x="-42" y="-100" width="84" height="72" rx="22" fill="url(#bodyGrad)" stroke="#2b3a55" stroke-width="5"/>
<line x1="0" y1="-100" x2="0" y2="-118" stroke="#2b3a55" stroke-width="5" stroke-linecap="round"/>
<circle cx="0" cy="-122" r="6" fill="#4a90e2"/>
<circle cx="-16" cy="-64" r="9" fill="#5ec9e8"/>
<circle cx="16" cy="-64" r="9" fill="#5ec9e8"/>
</g>

<!-- coin badge -->
<g transform="translate(150,480)">
<circle cx="0" cy="0" r="42" fill="url(#bodyGrad)" stroke="#2b3a55" stroke-width="5"/>
<circle cx="0" cy="0" r="18" fill="none" stroke="#4a90e2" stroke-width="5"/>
<line x1="0" y1="-24" x2="0" y2="24" stroke="#4a90e2" stroke-width="4"/>
</g>
</svg>