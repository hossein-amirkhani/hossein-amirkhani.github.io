<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg">
  <rect width="640" height="640" fill="#ffffff"/>
  <circle cx="330" cy="345" r="230" fill="#eaf1f9"/>

  <!-- ===================== duplicate "attempt" cards, multiplying ===================== -->
  <g>
    <!-- ghost/discarded attempt cards fanning out, greyed & crossed -->
    <g opacity="0.55">
      <rect x="255" y="150" width="86" height="58" rx="8" fill="#f3f4f6" stroke="#c7ccd6" stroke-width="2" transform="rotate(-14 298 179)"/>
      <line x1="270" y1="163" x2="326" y2="197" stroke="#c2455a" stroke-width="4" stroke-linecap="round" transform="rotate(-14 298 179)"/>
      <line x1="326" y1="163" x2="270" y2="197" stroke="#c2455a" stroke-width="4" stroke-linecap="round" transform="rotate(-14 298 179)"/>
      <text x="298" y="146" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#9aa3b2" text-anchor="middle" transform="rotate(-14 298 179)">attempt #1</text>
    </g>
    <g opacity="0.65">
      <rect x="330" y="132" width="86" height="58" rx="8" fill="#f3f4f6" stroke="#c7ccd6" stroke-width="2" transform="rotate(8 373 161)"/>
      <line x1="345" y1="145" x2="401" y2="179" stroke="#c2455a" stroke-width="4" stroke-linecap="round" transform="rotate(8 373 161)"/>
      <line x1="401" y1="145" x2="345" y2="179" stroke="#c2455a" stroke-width="4" stroke-linecap="round" transform="rotate(8 373 161)"/>
      <text x="373" y="129" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#9aa3b2" text-anchor="middle" transform="rotate(8 373 161)">attempt #2</text>
    </g>
    <g opacity="0.8">
      <rect x="300" y="185" width="90" height="60" rx="8" fill="#f7f8fa" stroke="#c7ccd6" stroke-width="2" transform="rotate(-3 345 215)"/>
      <line x1="316" y1="199" x2="374" y2="233" stroke="#c2455a" stroke-width="4" stroke-linecap="round" transform="rotate(-3 345 215)"/>
      <line x1="374" y1="199" x2="316" y2="233" stroke="#c2455a" stroke-width="4" stroke-linecap="round" transform="rotate(-3 345 215)"/>
      <text x="345" y="181" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#9aa3b2" text-anchor="middle" transform="rotate(-3 345 215)">attempt #3</text>
    </g>

    <!-- the kept, final result card: clean and highlighted -->
    <rect x="316" y="240" width="112" height="72" rx="10" fill="#ffffff" stroke="#2f5d8a" stroke-width="3"/>
    <circle cx="424" cy="240" r="15" fill="#3f9d6e"/>
    <path d="M417 240 l5 6 l10 -12" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="372" y="266" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2f5d8a" text-anchor="middle">result</text>
    <text x="372" y="286" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5a6b80" text-anchor="middle">kept</text>
  </g>

  <!-- ===================== robot (left) ===================== -->
  <g>
    <ellipse cx="150" cy="470" rx="95" ry="90" fill="#eaf1f9"/>
    <!-- body -->
    <rect x="95" y="380" width="110" height="130" rx="26" fill="#e7edf5" stroke="#aebfd6" stroke-width="3"/>
    <rect x="118" y="400" width="64" height="14" rx="7" fill="#bcd0ea"/>
    <!-- arm reaching up toward the duplicate cards -->
    <path d="M180 400 C 220 385, 240 350, 248 315" stroke="#cdd8e8" stroke-width="26" stroke-linecap="round" fill="none"/>
    <path d="M180 400 C 220 385, 240 350, 248 315" stroke="#aebfd6" stroke-width="26" stroke-linecap="round" fill="none" opacity="0.35"/>
    <circle cx="250" cy="308" r="16" fill="#dfe7f2" stroke="#aebfd6" stroke-width="3"/>
    <!-- other arm resting -->
    <path d="M100 410 C 70 430, 65 460, 78 485" stroke="#cdd8e8" stroke-width="24" stroke-linecap="round" fill="none"/>
    <circle cx="80" cy="490" r="15" fill="#dfe7f2" stroke="#aebfd6" stroke-width="3"/>
    <!-- head -->
    <rect x="100" y="300" width="100" height="86" rx="30" fill="#f2f5fa" stroke="#aebfd6" stroke-width="3"/>
    <circle cx="150" cy="288" r="8" fill="#aebfd6"/>
    <line x1="150" y1="280" x2="150" y2="300" stroke="#aebfd6" stroke-width="4"/>
    <rect x="118" y="322" width="64" height="38" rx="14" fill="#28405e"/>
    <circle cx="138" cy="341" r="7" fill="#6fd6e8"/>
    <circle cx="162" cy="341" r="7" fill="#6fd6e8"/>
    <path d="M138 356 Q150 362 162 356" stroke="#6fd6e8" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ===================== person (right) ===================== -->
  <g>
    <!-- legs -->
    <rect x="420" y="470" width="34" height="110" rx="10" fill="#7c8798"/>
    <rect x="470" y="470" width="34" height="110" rx="10" fill="#7c8798"/>
    <rect x="414" y="565" width="46" height="20" rx="8" fill="#1f2937"/>
    <rect x="464" y="565" width="46" height="20" rx="8" fill="#1f2937"/>
    <!-- torso / blazer -->
    <path d="M405 355 C 405 340, 425 328, 462 328 C 499 328, 519 340, 519 355 L 528 475 C 505 490, 420 490, 397 475 Z" fill="#2c3e60"/>
    <path d="M448 335 L 462 400 L 476 335 Z" fill="#ffffff"/>
    <!-- pointing arm, reaching toward the kept result card -->
    <path d="M420 350 C 385 345, 355 325, 335 305" stroke="#2c3e60" stroke-width="26" stroke-linecap="round" fill="none"/>
    <path d="M340 300 l-12 -8 M340 300 l-2 -15 M340 300 l11 -10" stroke="#f2c29b" stroke-width="7" stroke-linecap="round"/>
    <circle cx="341" cy="304" r="13" fill="#f2c29b"/>
    <!-- other arm resting -->
    <path d="M505 355 C 520 375, 520 400, 505 415" stroke="#2c3e60" stroke-width="26" stroke-linecap="round" fill="none"/>
    <circle cx="503" cy="418" r="14" fill="#f2c29b"/>
    <!-- head -->
    <circle cx="462" cy="295" r="42" fill="#f2c29b"/>
    <path d="M420 290 C 415 250, 445 225, 465 225 C 495 225, 508 250, 505 285 C 500 270, 485 260, 462 260 C 450 275, 432 280, 420 290 Z" fill="#22293a"/>
    <circle cx="447" cy="298" r="4" fill="#33261c"/>
    <circle cx="477" cy="298" r="4" fill="#33261c"/>
    <path d="M450 315 Q462 322 474 315" stroke="#8a5a3c" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
