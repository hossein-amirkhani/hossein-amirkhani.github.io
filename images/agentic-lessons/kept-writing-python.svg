<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg">
  <rect width="640" height="640" fill="#ffffff"/>
  <circle cx="330" cy="345" r="230" fill="#eaf1f9"/>

  <!-- ===================== monitor showing python code, blocked from running ===================== -->
  <g>
    <!-- monitor stand -->
    <rect x="300" y="430" width="24" height="30" fill="#c7d2e0"/>
    <rect x="270" y="458" width="84" height="14" rx="6" fill="#c7d2e0"/>
    <!-- monitor body -->
    <rect x="210" y="215" width="204" height="150" rx="12" fill="#28405e" stroke="#1c2e45" stroke-width="3"/>
    <rect x="224" y="229" width="176" height="122" rx="4" fill="#101c2e"/>
    <!-- code lines -->
    <text x="234" y="248" font-family="Menlo, Consolas, monospace" font-size="11" fill="#6fd6e8">&gt;&gt;&gt; import pandas</text>
    <text x="234" y="266" font-family="Menlo, Consolas, monospace" font-size="11" fill="#8fd6a6">def transform(rows):</text>
    <text x="234" y="284" font-family="Menlo, Consolas, monospace" font-size="11" fill="#8fd6a6">&#160;&#160;&#160;&#160;return run(rows)</text>
    <text x="234" y="302" font-family="Menlo, Consolas, monospace" font-size="11" fill="#e8c07d">subprocess.exec(</text>
    <text x="234" y="320" font-family="Menlo, Consolas, monospace" font-size="11" fill="#e8c07d">&#160;&#160;&#160;&#160;"python3 run.py")</text>
    <rect x="234" y="330" width="52" height="12" fill="#1c2e45"/>
    <rect x="234" y="330" width="30" height="12" fill="#6fd6e8" opacity="0.6"/>

    <!-- big blocked-execution badge over the screen -->
    <circle cx="386" cy="248" r="30" fill="#ffffff" stroke="#c2455a" stroke-width="5"/>
    <path d="M375 234 L375 262 L399 248 Z" fill="#c2455a"/>
    <line x1="364" y1="223" x2="408" y2="273" stroke="#c2455a" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- discarded script pages fluttering away from the monitor -->
  <g opacity="0.85">
    <rect x="120" y="180" width="46" height="60" rx="4" fill="#f7f8fa" stroke="#c7ccd6" stroke-width="2" transform="rotate(-18 143 210)"/>
    <line x1="128" y1="192" x2="158" y2="192" stroke="#c2455a" stroke-width="3" transform="rotate(-18 143 210)"/>
    <line x1="128" y1="202" x2="158" y2="202" stroke="#dfe3ea" stroke-width="3" transform="rotate(-18 143 210)"/>
    <line x1="128" y1="212" x2="150" y2="212" stroke="#dfe3ea" stroke-width="3" transform="rotate(-18 143 210)"/>
  </g>
  <g opacity="0.7">
    <rect x="150" y="130" width="42" height="54" rx="4" fill="#f7f8fa" stroke="#c7ccd6" stroke-width="2" transform="rotate(-8 171 157)"/>
    <line x1="158" y1="141" x2="184" y2="141" stroke="#c2455a" stroke-width="3" transform="rotate(-8 171 157)"/>
    <line x1="158" y1="150" x2="184" y2="150" stroke="#dfe3ea" stroke-width="3" transform="rotate(-8 171 157)"/>
  </g>

  <!-- ===================== robot (left), typing at the monitor ===================== -->
  <g>
    <ellipse cx="150" cy="480" rx="98" ry="90" fill="#eaf1f9"/>
    <rect x="95" y="392" width="110" height="128" rx="26" fill="#e7edf5" stroke="#aebfd6" stroke-width="3"/>
    <rect x="118" y="412" width="64" height="14" rx="7" fill="#bcd0ea"/>
    <!-- arms typing forward toward keyboard -->
    <path d="M180 415 C 210 410, 225 400, 232 388" stroke="#cdd8e8" stroke-width="24" stroke-linecap="round" fill="none"/>
    <circle cx="234" cy="384" r="14" fill="#dfe7f2" stroke="#aebfd6" stroke-width="3"/>
    <path d="M120 415 C 150 425, 175 420, 195 405" stroke="#cdd8e8" stroke-width="24" stroke-linecap="round" fill="none"/>
    <circle cx="198" cy="401" r="14" fill="#dfe7f2" stroke="#aebfd6" stroke-width="3"/>
    <!-- keyboard -->
    <rect x="150" y="378" width="96" height="20" rx="5" fill="#dfe7f2" stroke="#aebfd6" stroke-width="2"/>
    <!-- head -->
    <rect x="100" y="312" width="100" height="86" rx="30" fill="#f2f5fa" stroke="#aebfd6" stroke-width="3"/>
    <circle cx="150" cy="300" r="8" fill="#aebfd6"/>
    <line x1="150" y1="292" x2="150" y2="312" stroke="#aebfd6" stroke-width="4"/>
    <rect x="118" y="334" width="64" height="38" rx="14" fill="#28405e"/>
    <circle cx="138" cy="353" r="7" fill="#6fd6e8"/>
    <circle cx="162" cy="353" r="7" fill="#6fd6e8"/>
    <path d="M136 368 Q150 362 164 368" stroke="#6fd6e8" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ===================== direct pipeline (right): input file straight to output file, no code ===================== -->
  <g>
    <!-- input file -->
    <path d="M452 250 h34 l14 14 v46 h-48 z" fill="#ffffff" stroke="#aebfd6" stroke-width="3"/>
    <path d="M486 250 v14 h14" fill="none" stroke="#aebfd6" stroke-width="3"/>
    <line x1="460" y1="278" x2="490" y2="278" stroke="#c7d2e0" stroke-width="3"/>
    <line x1="460" y1="288" x2="490" y2="288" stroke="#c7d2e0" stroke-width="3"/>
    <text x="476" y="238" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5a6b80" text-anchor="middle">input</text>

    <!-- arrow straight across -->
    <path d="M504 296 C 520 320, 520 344, 504 366" stroke="#3f9d6e" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M494 358 l10 10 l12 -6" stroke="#3f9d6e" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- output file with check -->
    <path d="M452 376 h34 l14 14 v46 h-48 z" fill="#ffffff" stroke="#2f5d8a" stroke-width="3"/>
    <path d="M486 376 v14 h14" fill="none" stroke="#2f5d8a" stroke-width="3"/>
    <line x1="460" y1="404" x2="490" y2="404" stroke="#cdd8e8" stroke-width="3"/>
    <line x1="460" y1="414" x2="490" y2="414" stroke="#cdd8e8" stroke-width="3"/>
    <circle cx="500" cy="428" r="14" fill="#3f9d6e"/>
    <path d="M493 428 l5 6 l10 -12" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="476" y="452" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5a6b80" text-anchor="middle">output</text>
  </g>

  <!-- ===================== person (right), gesturing at the direct pipeline ===================== -->
  <g>
    <rect x="420" y="490" width="34" height="100" rx="10" fill="#7c8798"/>
    <rect x="470" y="490" width="34" height="100" rx="10" fill="#7c8798"/>
    <rect x="414" y="575" width="46" height="20" rx="8" fill="#1f2937"/>
    <rect x="464" y="575" width="46" height="20" rx="8" fill="#1f2937"/>
    <path d="M405 375 C 405 360, 425 348, 462 348 C 499 348, 519 360, 519 375 L 528 495 C 505 510, 420 510, 397 495 Z" fill="#2c3e60"/>
    <path d="M448 355 L 462 420 L 476 355 Z" fill="#ffffff"/>
    <!-- pointing arm toward the pipeline -->
    <path d="M406 370 C 385 350, 370 335, 358 320" stroke="#2c3e60" stroke-width="24" stroke-linecap="round" fill="none"/>
    <path d="M354 314 l-13 -6 M354 314 l-4 -14 M354 314 l10 -12" stroke="#f2c29b" stroke-width="7" stroke-linecap="round"/>
    <circle cx="356" cy="317" r="13" fill="#f2c29b"/>
    <!-- other arm resting -->
    <path d="M505 375 C 520 395, 520 420, 505 435" stroke="#2c3e60" stroke-width="24" stroke-linecap="round" fill="none"/>
    <circle cx="503" cy="438" r="13" fill="#f2c29b"/>
    <!-- head -->
    <circle cx="462" cy="315" r="40" fill="#f2c29b"/>
    <path d="M422 310 C 417 272, 446 248, 465 248 C 494 248, 506 272, 503 305 C 498 290, 484 281, 462 281 C 451 295, 434 300, 422 310 Z" fill="#22293a"/>
    <circle cx="448" cy="317" r="4" fill="#33261c"/>
    <circle cx="477" cy="317" r="4" fill="#33261c"/>
    <path d="M450 334 Q462 340 474 334" stroke="#8a5a3c" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
